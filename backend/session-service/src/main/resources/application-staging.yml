# Session Service - Staging Profile
# Environment variable-based connections, INFO logging, moderate security

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://staging.quizplatform.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,X-Correlation-ID

logging:
  level:
    com.quizplatform: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
    io.lettuce.core: WARN
