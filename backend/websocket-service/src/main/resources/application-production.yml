# WebSocket Service - Production Profile
# Strict security, optimized settings, WARN logging, TLS enabled

server:
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    key-store: ${SERVER_SSL_KEY_STORE}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: true

websocket:
  max-connections: 10000
  heartbeat-interval-ms: 15000
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:https://quizplatform.com}

services:
  session-service:
    url: ${SESSION_SERVICE_URL:http://session-service.quiz-system.svc.cluster.local:8082}
  auth-service:
    url: ${AUTH_SERVICE_URL:http://auth-service.quiz-system.svc.cluster.local:8080}
  quiz-service:
    url: ${QUIZ_SERVICE_URL:http://quiz-service.quiz-system.svc.cluster.local:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://quizplatform.com}
  allowed-methods: GET,POST,OPTIONS
  allowed-headers: Authorization,Content-Type,X-Correlation-ID

logging:
  level:
    com.quizplatform: WARN
    org.springframework: WARN
    org.springframework.web.socket: ERROR
    io.lettuce.core: ERROR
    io.netty: ERROR

management:
  endpoint:
    health:
      show-details: never
