# Analytics Service - Production Profile
# Strict security, optimized pool sizes, WARN logging, TLS enabled

server:
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    key-store: ${SERVER_SSL_KEY_STORE}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://auth-service.quiz-system.svc.cluster.local:8080}
  quiz-service:
    url: ${QUIZ_SERVICE_URL:http://quiz-service.quiz-system.svc.cluster.local:8081}
  session-service:
    url: ${SESSION_SERVICE_URL:http://session-service.quiz-system.svc.cluster.local:8082}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://quizplatform.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,X-Correlation-ID

logging:
  level:
    com.quizplatform: WARN
    org.springframework: WARN
    org.hibernate: ERROR
    org.apache: ERROR

management:
  endpoint:
    health:
      show-details: never
