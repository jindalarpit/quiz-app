server:
  port: 0

spring:
  application:
    name: quiz-service-test
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.quizplatform: DEBUG
    org.springframework.web: DEBUG
