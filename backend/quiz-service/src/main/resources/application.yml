server:
  port: 8081

spring:
  application:
    name: quiz-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quizplatform}
    username: ${SPRING_DATASOURCE_USERNAME:quiz}
    password: ${SPRING_DATASOURCE_PASSWORD:quiz_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: quiz

services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}
  session-service:
    url: ${SESSION_SERVICE_URL:http://localhost:8082}
  websocket-service:
    url: ${WEBSOCKET_SERVICE_URL:http://localhost:8084}
  analytics-service:
    url: ${ANALYTICS_SERVICE_URL:http://localhost:8083}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.quizplatform: DEBUG
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%level","service":"${spring.application.name}","logger":"%logger{36}","message":"%msg"}%n'
