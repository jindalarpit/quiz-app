spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: public

jwt:
  secret: integration-test-secret-key-that-is-at-least-32-characters-long-for-hmac-sha256
  expiration-ms: 86400000
  refresh-expiration-days: 7

oauth:
  google:
    client-id: test-google-client-id
    client-secret: test-google-client-secret
    redirect-uri: http://localhost:3000/auth/callback
    auth-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
    scope: openid,email,profile
  github:
    client-id: test-github-client-id
    client-secret: test-github-client-secret
    redirect-uri: http://localhost:3000/auth/callback
    auth-uri: https://github.com/login/oauth/authorize
    token-uri: https://github.com/login/oauth/access_token
    user-info-uri: https://api.github.com/user
    scope: read:user,user:email

logging:
  level:
    com.quizplatform: DEBUG
    org.testcontainers: INFO
