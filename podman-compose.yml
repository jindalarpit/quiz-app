# Full-stack compose file for Real-Time Quiz Platform
# Runs all services in containers (for integration testing or demo)
#
# Start:  podman-compose up -d
# Stop:   podman-compose down
# Logs:   podman-compose logs -f <service-name>
#
# For local development, use podman-compose-infra.yml instead
# (runs only PostgreSQL + Redis, you run services from IDE)

services:
  # ============================================================
  # DATA LAYER
  # ============================================================
  postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: quiz-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: quizplatform
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/podman/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quizplatform"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: quiz-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - quiz-network

  # ============================================================
  # APPLICATION SERVICES
  # ============================================================
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: quiz-auth-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/quizplatform
      SPRING_DATASOURCE_USERNAME: quiz
      SPRING_DATASOURCE_PASSWORD: quiz_dev_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - quiz-network

  quiz-service:
    build:
      context: ./backend/quiz-service
      dockerfile: Dockerfile
    container_name: quiz-quiz-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/quizplatform
      SPRING_DATASOURCE_USERNAME: quiz
      SPRING_DATASOURCE_PASSWORD: quiz_dev_password
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - quiz-network

  session-service:
    build:
      context: ./backend/session-service
      dockerfile: Dockerfile
    container_name: quiz-session-service
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/quizplatform
      SPRING_DATASOURCE_USERNAME: quiz
      SPRING_DATASOURCE_PASSWORD: quiz_dev_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      QUIZ_SERVICE_URL: http://quiz-service:8080
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - quiz-network

  websocket-service:
    build:
      context: ./backend/websocket-service
      dockerfile: Dockerfile
    container_name: quiz-websocket-service
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SESSION_SERVICE_URL: http://session-service:8080
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - quiz-network

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: quiz-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AUTH_SERVICE_URL: http://auth-service:8080
      QUIZ_SERVICE_URL: http://quiz-service:8080
      SESSION_SERVICE_URL: http://session-service:8080
      WEBSOCKET_SERVICE_URL: http://websocket-service:8080
      ANALYTICS_SERVICE_URL: http://analytics-service:8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
    depends_on:
      - auth-service
      - quiz-service
      - session-service
      - websocket-service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - quiz-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8084
    depends_on:
      - api-gateway
    networks:
      - quiz-network

volumes:
  pgdata:
  redisdata:

networks:
  quiz-network:
    driver: bridge
